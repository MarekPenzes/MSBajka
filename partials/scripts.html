<script>
document.addEventListener("DOMContentLoaded", function () {
  var targets = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window) || targets.length === 0) {
    targets.forEach(function (el) { el.classList.add("is-visible"); });
    return;
  }
  var observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
  );
  targets.forEach(function (el) { observer.observe(el); });
});

document.addEventListener("DOMContentLoaded", function () {
  var images = document.querySelectorAll(".gallery-img");
  if (images.length === 0) return;

  function markLoaded(img, index) {
    setTimeout(function () {
      img.classList.add("is-loaded");
    }, index * 90);
  }

  if (!("IntersectionObserver" in window)) {
    images.forEach(function (img, index) { markLoaded(img, index); });
    return;
  }

  var observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        var img = entry.target;
        if (entry.isIntersecting) {
          if (img.complete) {
            markLoaded(img, 0);
          } else {
            img.addEventListener("load", function () { markLoaded(img, 0); });
          }
          observer.unobserve(img);
        }
      });
    },
    { threshold: 0.1, rootMargin: "0px 0px -40px 0px" }
  );
  images.forEach(function (img) { observer.observe(img); });
});

document.addEventListener("DOMContentLoaded", function () {
  var images = Array.prototype.slice.call(document.querySelectorAll(".gallery-img"));
  if (images.length === 0) return;

  var overlay = document.createElement("div");
  overlay.className = "lightbox-overlay";
  overlay.innerHTML =
    '<button class="lightbox-close" aria-label="Zavrieť">&times;</button>' +
    '<button class="lightbox-prev" aria-label="Predchádzajúci">&#8249;</button>' +
    '<img src="" alt="">' +
    '<button class="lightbox-next" aria-label="Ďalší">&#8250;</button>';
  document.body.appendChild(overlay);

  var overlayImg = overlay.querySelector("img");
  var closeBtn = overlay.querySelector(".lightbox-close");
  var prevBtn = overlay.querySelector(".lightbox-prev");
  var nextBtn = overlay.querySelector(".lightbox-next");
  var currentIndex = 0;

  function show(index) {
    currentIndex = (index + images.length) % images.length;
    var img = images[currentIndex];
    overlayImg.src = img.src;
    overlayImg.alt = img.alt || "";
  }

  function open(index) {
    show(index);
    overlay.classList.add("is-open");
    document.body.style.overflow = "hidden";
  }

  function close() {
    overlay.classList.remove("is-open");
    document.body.style.overflow = "";
  }

  images.forEach(function (img, index) {
    img.addEventListener("click", function () { open(index); });
  });

  closeBtn.addEventListener("click", close);
  prevBtn.addEventListener("click", function () { show(currentIndex - 1); });
  nextBtn.addEventListener("click", function () { show(currentIndex + 1); });

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) close();
  });

  document.addEventListener("keydown", function (e) {
    if (!overlay.classList.contains("is-open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(currentIndex - 1);
    if (e.key === "ArrowRight") show(currentIndex + 1);
  });
});
</script>
